name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_catalog.py
      - run: python3 scripts/validate_embedded_skills.py
      - run: python3 scripts/test_embedded_skills.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/endgame_audit.py
      - run: python3 scripts/skills.py --status validated --json
      - run: python3 -m compileall -q scripts skills
      - run: python3 scripts/build_distribution.py --out dist/ai-skills-hub.zip
