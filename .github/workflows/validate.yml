name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_catalog.py
      - run: python3 scripts/validate_embedded_skills.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/endgame_audit.py
      - run: python3 scripts/skills.py --status validated --json
